[package]
name = "herdr-nvim"
version = "0.3.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
crossterm = "0.28"
# fff-search backend for the picker's fuzzy fallback tier. Users install
# prebuilt release binaries, so the extra dependency weight is a CI/build
# cost, not a user-facing one.
fff-search = "0.10.6"

[[example]]
name = "fff_cold"

[dev-dependencies]
regex = "1"

[profile.release]
lto = true
strip = true
