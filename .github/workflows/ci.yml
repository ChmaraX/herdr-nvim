name: ci
on:
  push:
  pull_request:
# The jobs only read the checkout.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - uses: extractions/setup-just@v2
      - run: just ci

  # Windows uses named pipes instead of filesystem sockets and a different
  # process-detach path, so it needs its own job. Crucially, `cargo test` here
  # runs `ensure_daemon_spawns_then_is_idempotent_against_real_nvim`, which
  # spawns a real headless nvim daemon over a `\\.\pipe\...` named pipe and
  # health-checks it — the runtime smoke test for the Windows daemon path.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: cargo fmt --check
        run: cargo fmt --check
      # Runs the whole suite, including the #[cfg(windows)] unit tests
      # (named-pipe socket_path, Windows drive-path extraction) and the real
      # nvim named-pipe daemon health check.
      - name: cargo test
        run: cargo test
      # Each integration test writes what it ran and saw here.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-windows
          path: target/test-artifacts/
      # Same Lua test surface the Linux job exercises, on Windows nvim.
      - name: lua tests
        run: nvim --headless --noplugin -u NONE -l tests/run.lua

  # The Herdr app install end to end, without the app: the bootstrap (on
  # Windows install.ps1 under Windows PowerShell 5.1) into private folders
  # against a stand-in herdr-app and hc (examples/herdr_app_stub.rs): fresh
  # install with a Neovim download, arguments through the launcher, upgrade
  # while held, migration, crash recovery, byte-exact uninstall. Its
  # transcript and snapshots are uploaded on every run.
  install-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: cargo build --release --bins --example herdr_app_stub
      - name: install e2e
        run: pwsh -NoProfile -File herdr-app/e2e/install-e2e.ps1 -Out e2e-out/${{ runner.os }} -NvimDownload
        env:
          # Neovim's release lookup (api.github.com) is rate-limited without it.
          GITHUB_TOKEN: ${{ github.token }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-e2e-${{ runner.os }}
          path: e2e-out/

  # The Lua suite on macOS too (copy, case-only rename, roots: APFS ignores
  # case, unlike the Linux runner's ext4).
  lua-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: nvim --headless --noplugin -u NONE -l tests/run.lua

  # The Windows facts probe (doc/windows-facts.md), built for a person to run
  # with the real app (herdr-app/e2e/WINDOWS-CHECKLIST.md step 1).
  winprobe-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --example winprobe
      - uses: actions/upload-artifact@v4
        with:
          name: winprobe-windows
          path: target/release/examples/winprobe.exe

  # The plugin's Windows build hook, run the way `herdr plugin install` runs
  # it: the prebuilt download, the source-build fallback, and the error when
  # neither works. This image has VS 2026 and no VS 2022 (#67).
  plugin-install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: plugin install tests
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/install-windows.ps1
