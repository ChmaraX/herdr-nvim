name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - uses: extractions/setup-just@v2
      - run: just ci
