name: release
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and attach binaries to (e.g. v0.2.1)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach binaries to (e.g. v0.2.1)"
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    strategy:
      # One target's failure must not cancel the others' uploads.
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          # The plugin's Windows install (herdr/install.ps1) downloads this.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      # Pinned, not `stable`: on macOS `stable` means `brew install neovim`,
      # and Homebrew no longer ships bottles for the macos-13/14 runners, so it
      # builds from source and fails at `brew link` (v1.2.0 shipped without
      # macOS binaries). A pinned version downloads Neovim's own release
      # tarball on every OS instead.
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.5
      - run: rustup target add ${{ matrix.target }}
      # Short TMPDIR: test sandboxes put nvim listen sockets under the temp
      # dir, and macOS's default /var/folders/... TMPDIR can push them past
      # the 104-byte sun_path limit, which nvim >= 0.12.5 rejects.
      - run: cargo test
        env:
          TMPDIR: ${{ runner.temp }}
      - run: nvim --headless --noplugin -u NONE -l tests/run.lua
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/herdr-nvim${{ matrix.exe }} herdr-nvim-${{ matrix.target }}${{ matrix.exe }}
        shell: bash
      # The Herdr app's install (install.sh and install.ps1 download it): the
      # same binary, the mod's launcher, the Lua and the app's mods, and its
      # SHA-256. Packed with bash on every runner (Git Bash on Windows; the
      # person's install needs none).
      - run: herdr-app/bundle.sh target/${{ matrix.target }}/release/herdr-nvim${{ matrix.exe }} ${{ matrix.target }} .
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            herdr-nvim-${{ matrix.target }}${{ matrix.exe }}
            herdr-nvim-app-${{ matrix.target }}.tar.gz
            herdr-nvim-app-${{ matrix.target }}.tar.gz.sha256
      # The published asset, downloaded and run by the same test that CI runs
      # (only its prebuilt case), where a missing or misnamed Windows binary
      # fails instead of skipping.
      - if: runner.os == 'Windows'
        name: plugin install tests (published binary)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/install-windows.ps1 -RequirePrebuilt
      # The published app bundle, downloaded as a person's install.ps1 gets
      # it, through the install E2E (fresh install, launcher, upgrade,
      # uninstall) against the stand-in app, under Windows PowerShell 5.1.
      - if: runner.os == 'Windows'
        name: app install E2E (published bundle)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "herdr-nvim-app-${{ matrix.target }}.tar.gz"
          New-Item -ItemType Directory -Force published | Out-Null
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern $name --pattern "$name.sha256" --dir published
          cargo build --release --example herdr_app_stub
          pwsh -NoProfile -File herdr-app/e2e/install-e2e.ps1 -Bundle "published/$name" -Out e2e-out/published
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-published-windows
          path: e2e-out/
          if-no-files-found: ignore
