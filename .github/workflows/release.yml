name: release
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and attach binaries to (e.g. v0.2.1)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach binaries to (e.g. v0.2.1)"
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test
      - run: nvim --headless --noplugin -u NONE -l tests/run.lua
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/herdr-nvim herdr-nvim-${{ matrix.target }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: herdr-nvim-${{ matrix.target }}
