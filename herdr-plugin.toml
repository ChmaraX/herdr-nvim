id = "chmarax.herdr-nvim"
name = "herdr-nvim"
version = "1.0.1"
min_herdr_version = "0.7.4"
platforms = ["macos", "linux", "windows"]
description = "Full-height nvim sidebar with agent annotations: toggle with one key, comment code, send to any agent."

[[actions]]
id = "toggle"
title = "nvim sidebar: toggle"
contexts = ["pane", "workspace"]
command = ["bin/herdr-nvim", "toggle"]

# Overlay pane that renders the file picker. Opened programmatically by the
# `pick-file` action (via `herdr plugin pane open --entrypoint picker`), which
# passes the handoff path in `HERDR_NVIM_HANDOFF`.
#
# Pane commands run with the pane's own cwd, and a relative program name is
# resolved against PATH rather than the plugin checkout — so `bin/herdr-nvim`
# fails to spawn for a `herdr plugin install` checkout. Go through
# `$HERDR_PLUGIN_ROOT`, which herdr exports for every plugin process.
[[panes]]
id = "picker"
title = "open file"
placement = "popup"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-nvim\" picker"]

# Full-height nvim sidebar pane. Opened programmatically by the `toggle` action
# via `herdr plugin pane open --entrypoint sidebar --placement split`, which
# spawns this command NON-INTERACTIVELY (sh -c, no interactive shell) so there
# is no shell prompt/echo of the command line in the pane. The tab id comes
# from herdr's HERDR_TAB_ID env (set for plugin panes); the cwd is the pane's
# own cwd (set via --cwd). See daemon::sidebar_cmd. The command resolves via
# `$HERDR_PLUGIN_ROOT` for the same reason as the picker pane above.
[[panes]]
id = "sidebar"
title = "nvim sidebar"
placement = "split"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-nvim\" sidebar"]

[[actions]]
id = "pick-file"
title = "nvim sidebar: open file from agent output"
contexts = ["pane"]
command = ["bin/herdr-nvim", "pick-file"]

# Invoked by herdr on Ctrl+click of a link_handlers match below — never bound
# to a key or palette entry directly.
[[actions]]
id = "open-link"
title = "nvim sidebar: open clicked file"
command = ["bin/herdr-nvim", "open-link"]

# Linkify plain-text file paths in every pane's output. Conservative: requires
# a directory segment + extension (bare `README.md` stays unlinkified to avoid
# "Node.js"/"e.g." false positives — the pick-file picker covers those).
# Optional :line[:col]; Next.js ()/[] route segments allowed.
[[link_handlers]]
id = "file-path"
title = "Open in nvim sidebar"
pattern = '^~?[\w.@/()\[\]\\:+-]+[\\/][\w.@()\[\]\\:+-]+\.[A-Za-z]\w*(?::\d+){0,2}$'
action = "open-link"

# Agents' own OSC 8 file:// links (e.g. Claude Code's) — otherwise herdr would
# hand them to the browser.
[[link_handlers]]
id = "file-url"
title = "Open in nvim sidebar"
pattern = '^file://'
action = "open-link"

[[build]]
command = ["bash", "herdr/install.sh"]
platforms = ["macos", "linux"]

[[build]]
command = ["powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "herdr/install.ps1"]
platforms = ["windows"]
